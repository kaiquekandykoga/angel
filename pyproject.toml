[project]
name = "angel"
version = "0.1.0"
description = "Multi-Agent System using Python"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Kaíque Kandy Koga", email = "kaiquekandykoga@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.1",
]

[project.scripts]
angel = "angel.__main__:main"
ci = "angel.__ci__:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "respx>=0.22",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = ["integration: exercises client code over recorded HTTP payloads"]

[tool.basedpyright]
typeCheckingMode = "standard"
reportDeprecated = "error"
