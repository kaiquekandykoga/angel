[project]
name = "nishikihebi"
version = "0.1.0"
description = "Multi-Agent System using Python"
readme = "README.md"
authors = [
    { name = "Kaíque Kandy Koga", email = "kaiquekandykoga@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "langchain-nvidia-ai-endpoints>=0.3.19",
    "langgraph>=0.6.11",
]

[project.scripts]
nishikihebi = "nishikihebi:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.16.1",
]

[tool.basedpyright]
typeCheckingMode = "standard"
