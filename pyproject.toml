[project]
name = "nishikihebi"
version = "0.1.0"
description = "Multi-Agent System using Python"
readme = "README.md"
authors = [
    { name = "Kaíque Kandy Koga", email = "kaiquekandykoga@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.1",
]

[project.scripts]
nishikihebi = "nishikihebi.__main__:main"
ci = "nishikihebi.ci:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "C4", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.basedpyright]
typeCheckingMode = "standard"
